<!doctype html>
<html lang="en" data-theme="dark" data-accent="violet" data-grid="justified" data-size="3" data-spacing="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Shared · Media Vault</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <script>try { if (matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light"; } catch {}</script>
  <link rel="stylesheet" href="app.css?v=34">
</head>
<body class="share-page">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M8 13h8M8 17h5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3M12 9v4M12 17h.01"/></symbol>
  </svg>

  <main class="share-main">
    <header class="share-top">
      <a class="brand" href="/"><img src="icon.svg" alt=""> Media Vault</a>
    </header>
    <!-- A client gallery: cover, studio, title, message, Download all and Favorites (share.js renderHero) -->
    <section id="gHero" class="g-hero" hidden></section>
    <div id="shareHead" class="share-head" hidden>
      <div>
        <h1 id="title"></h1>
        <p id="meta" class="muted"></p>
      </div>
      <button id="dlAll" class="btn primary" hidden><svg class="i"><use href="#i-download"/></svg>Download all</button>
    </div>
    <div id="grid" class="grid-wrap"></div>
    <div id="empty" class="empty" hidden></div>
  </main>

  <div id="viewer" class="viewer" hidden>
    <div class="v-top">
      <button data-v="close" class="icon-btn" title="Close (Esc)"><svg class="i"><use href="#i-x"/></svg></button>
      <span id="vName" class="v-name"></span>
      <button data-v="heart" class="icon-btn v-heart" title="Add to favorites (F)" hidden><svg class="i"><use href="#i-heart"/></svg></button>
      <button data-v="download" class="icon-btn" title="Download"><svg class="i"><use href="#i-download"/></svg></button>
    </div>
    <div class="v-body">
      <div id="vStage" class="v-stage simple"></div>
      <button data-v="prev" class="v-nav prev" title="Previous (←)"><svg class="i"><use href="#i-left"/></svg></button>
      <button data-v="next" class="v-nav next" title="Next (→)"><svg class="i"><use href="#i-right"/></svg></button>
    </div>
  </div>

  <div id="dlg" class="modal dlg" hidden><div class="modal-card dlg-card"></div></div>

  <script type="module" src="share.js?v=7"></script>
</body>
</html>
