<!doctype html>
<html lang="en" data-theme="dark" data-accent="violet" data-grid="square" data-size="3" data-spacing="normal" data-sidebar="full" data-sites="cards">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <title>Media Vault</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <script>
    // Apply saved appearance before the first paint (see applyPrefs in app.js).
    try {
      const p = JSON.parse(localStorage.getItem("mv-prefs") || "{}") || {}, d = document.documentElement;
      const light = matchMedia("(prefers-color-scheme: light)").matches;
      if (p.theme) d.dataset.theme = p.theme === "system" ? (light ? "light" : "dark") : p.theme;
      for (const k of ["accent", "grid", "size", "spacing", "sidebar", "sites"]) if (p[k]) d.dataset[k] = p[k];
    } catch {}
  </script>
  <link rel="stylesheet" href="app.css?v=34">
</head>
<body>

  </svg>

  <!-- Sign in / first-run -->
  <section id="auth" class="auth" hidden>
    <form id="authForm" class="auth-card">
      <img src="icon.svg" alt="" class="auth-logo">
      <div class="auth-head">
        <h1>Media Vault</h1>
        <p id="authHint" class="muted">Sign in to your library</p>
      </div>
      <label id="nameRow" hidden>Name<input name="name" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
      <label id="confirmRow" hidden>Confirm password<input name="confirm" type="password" minlength="8" autocomplete="new-password"></label>
      <label id="inviteRow" hidden>Invite code<input name="invite" class="mono" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX"></label>
      <p id="authError" class="error" hidden></p>
      <button class="btn primary lg" id="authSubmit">Sign in</button>
      <button type="button" class="link" id="authToggle" hidden>Have an invite code? Create an account</button>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand"><img src="icon.svg" alt=""><span class="brand-name">Media Vault</span>
        <button id="sideToggle" class="icon-btn sm side-toggle" title="Compact sidebar"><svg class="i"><use href="#i-panel"/></svg></button></div>
      <nav class="nav">
        <button data-nav="library" class="active"><svg class="i"><use href="#i-grid"/></svg> Library</button>
        <button data-nav="favorites"><svg class="i"><use href="#i-heart"/></svg> Favorites</button>
        <button data-nav="albums"><svg class="i"><use href="#i-images"/></svg> Albums</button>
        <button data-nav="galleries" id="galleriesNav" hidden><svg class="i"><use href="#i-camera"/></svg> Galleries</button>
        <button data-nav="inbox"><svg class="i"><use href="#i-users"/></svg> Shared with me <span id="inboxCount" class="nav-n"></span></button>
        <button data-nav="map"><svg class="i"><use href="#i-map"/></svg> Map</button>
        <button data-nav="locked"><svg class="i"><use href="#i-lock"/></svg> Locked folder</button>
        <button data-nav="trash"><svg class="i"><use href="#i-trash"/></svg> Trash <span id="trashCount" class="nav-n"></span></button>
        <button data-nav="sites" id="sitesNav" hidden><svg class="i"><use href="#i-globe"/></svg> Sites</button>
        <button id="sharesBtn"><svg class="i"><use href="#i-link"/></svg> Shared links</button>
        <button id="invitesBtn" hidden><svg class="i"><use href="#i-users"/></svg> People</button>
      </nav>
      <div class="side-head">
        <span>Albums</span>
        <button id="newAlbumBtn" class="icon-btn sm" title="New album or folder"><svg class="i"><use href="#i-plus"/></svg></button>
      </div>
      <div id="albumList" class="album-list"></div>
      <div id="stats" class="stats"></div>
      <div class="side-foot">
        <span id="avatar" class="avatar"></span>
        <span id="whoami" class="who"></span>
        <button id="appearanceBtn" class="icon-btn sm" title="Appearance"><svg class="i"><use href="#i-palette"/></svg></button>
        <button id="logoutBtn" class="icon-btn sm" title="Sign out"><svg class="i"><use href="#i-logout"/></svg></button>
      </div>
    </aside>
    <div id="scrim" class="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" title="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
        <label class="search">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search names and tags">
        </label>
        <button id="uploadBtn" class="btn primary"><svg class="i"><use href="#i-upload"/></svg><span class="hide-sm">Upload</span></button>
        <input id="fileInput" type="file" multiple accept="image/*,video/*,.gif,.mkv,.avi,.mov,.heic,.insp,.insv,.lrv" hidden>
      </header>

      <div class="toolbar">
        <div class="title-wrap">
          <h2 id="viewTitle">Library</h2>
          <span id="viewCount" class="count"></span>
          <span id="albumActions" class="title-actions" hidden>
            <button id="shareAlbumBtn" class="btn ghost sm"><svg class="i"><use href="#i-share"/></svg>Share</button>
            <button id="galleryAlbumBtn" class="btn ghost sm" hidden><svg class="i"><use href="#i-camera"/></svg>Client gallery</button>
            <button id="editRulesBtn" class="btn ghost sm" hidden><svg class="i"><use href="#i-sliders"/></svg>Edit rules</button>
            <button id="albumFolderBtn" class="btn ghost sm"><svg class="i"><use href="#i-folder"/></svg>Folder</button>
            <button id="renameAlbumBtn" class="btn ghost sm"><svg class="i"><use href="#i-pencil"/></svg>Rename</button>
            <button id="deleteAlbumBtn" class="btn ghost sm danger"><svg class="i"><use href="#i-trash"/></svg>Delete</button>
          </span>
          <span id="folderActions" class="title-actions" hidden>
            <button id="folderRenameBtn" class="btn ghost sm"><svg class="i"><use href="#i-pencil"/></svg>Rename</button>
            <button id="folderDeleteBtn" class="btn ghost sm danger"><svg class="i"><use href="#i-trash"/></svg>Delete</button>
          </span>
          <span id="trashActions" class="title-actions" hidden>
            <button id="emptyTrashBtn" class="btn ghost sm danger"><svg class="i"><use href="#i-trash"/></svg>Empty trash</button>
          </span>
          <span id="vaultActions" class="title-actions" hidden>
            <button id="vBackBtn" class="btn ghost sm" hidden><svg class="i"><use href="#i-left"/></svg>Back</button>
            <button id="renameFolderBtn" class="btn ghost sm" hidden><svg class="i"><use href="#i-pencil"/></svg>Rename</button>
            <button id="deleteFolderBtn" class="btn ghost sm danger" hidden><svg class="i"><use href="#i-trash"/></svg>Delete folder</button>
            <button id="lockNowBtn" class="btn ghost sm"><svg class="i"><use href="#i-lock"/></svg>Lock now</button>
            <button id="changePassBtn" class="btn ghost sm"><svg class="i"><use href="#i-key"/></svg>Passphrase</button>
          </span>
        </div>
        <div class="filters" id="filters">
          <div class="chips">
            <button data-kind="all" class="chip active">All</button>
            <button data-kind="image" class="chip">Photos</button>
            <button data-kind="video" class="chip">Videos</button>
            <button data-kind="gif" class="chip">GIFs</button>
            <button data-kind="file" class="chip" hidden>Files</button>
          </div>
          <label class="select" id="sortWrap">
            <svg class="i"><use href="#i-sort"/></svg>
            <select id="sort" title="Sort">
              <option value="-takenAt">Date taken · newest</option>
              <option value="takenAt">Date taken · oldest</option>
              <option value="-created">Recently added</option>
              <option value="title">Name A–Z</option>
              <option value="-size">Largest first</option>
            </select>
          </label>
          <div class="view-wrap">
            <button id="viewBtn" class="btn" title="View options"><svg class="i"><use href="#i-layout"/></svg><span class="hide-sm">View</span></button>
            <div id="viewPop" class="pop" hidden></div>
          </div>
          <button id="selectBtn" class="btn">Select</button>
        </div>
      </div>

      <p id="trashNote" class="note" hidden><svg class="i"><use href="#i-info"/></svg>Items in Trash are deleted forever 30 days after you delete them.</p>

      <div id="selBar" class="selbar" hidden>
        <div class="sel-info">
          <button data-bulk="cancel" class="icon-btn sm" title="Done"><svg class="i"><use href="#i-x"/></svg></button>
          <strong id="selCount">0 selected</strong>
          <button data-bulk="all" class="btn ghost sm">Select all</button>
        </div>
        <div class="sel-actions">
          <button data-bulk="fav" class="act"><svg class="i"><use href="#i-heart"/></svg><span>Favorite</span></button>
          <button data-bulk="album" class="act"><svg class="i"><use href="#i-folder-plus"/></svg><span>Add to album</span></button>
          <button data-bulk="folder" class="act"><svg class="i"><use href="#i-folder"/></svg><span>Move to folder</span></button>
          <button data-bulk="unalbum" class="act" hidden><svg class="i"><use href="#i-folder-minus"/></svg><span>Remove</span></button>
          <button data-bulk="share" class="act"><svg class="i"><use href="#i-share"/></svg><span>Share</span></button>
          <button data-bulk="gallery" class="act" hidden><svg class="i"><use href="#i-camera"/></svg><span>Gallery</span></button>
          <button data-bulk="restore" class="act" hidden><svg class="i"><use href="#i-restore"/></svg><span>Restore</span></button>
          <button data-bulk="lock" class="act"><svg class="i"><use href="#i-lock"/></svg><span>Lock</span></button>
          <button data-bulk="move" class="act" hidden><svg class="i"><use href="#i-folder"/></svg><span>Move</span></button>
          <button data-bulk="unlock" class="act" hidden><svg class="i"><use href="#i-unlock"/></svg><span>Unlock</span></button>
          <button data-bulk="download" class="act"><svg class="i"><use href="#i-download"/></svg><span>Download</span></button>
          <button data-bulk="delete" class="act danger"><svg class="i"><use href="#i-trash"/></svg><span>Delete</span></button>
        </div>
      </div>

      <section id="memories" class="memories" hidden></section>
      <div id="vFolders" class="vfolders" hidden></div>
      <div id="albumGrid" class="album-grid" hidden></div>
      <div id="grid" class="grid-wrap"></div>
      <div id="sitesView" class="sites-view" hidden></div>
      <div id="galleriesView" class="galleries-view" hidden></div>
      <div id="inboxView" class="inbox-view" hidden></div>
      <div id="mapView" class="map-view" hidden><div id="map"></div><div id="mapStatus" class="map-status" hidden></div><div id="mapEmpty" class="map-empty" hidden></div></div>
      <div id="rail" class="rail" hidden><div class="rail-track"></div><div class="rail-knob"></div><div class="rail-tip" hidden></div></div>
      <div id="empty" class="empty" hidden></div>
      <div id="sentinel" class="sentinel"></div>
    </main>
  </div>

  <!-- Viewer -->
  <div id="viewer" class="viewer" hidden>
    <div class="v-top">
      <button data-v="close" class="icon-btn" title="Close (Esc)"><svg class="i"><use href="#i-x"/></svg></button>
      <div class="v-title"><span id="vName" class="v-name"></span><span id="vMeta" class="v-meta"></span></div>
      <div class="v-actions">
      <span id="vZoomCtl" class="v-zoom">
        <button data-v="zoomout" class="icon-btn" title="Zoom out (-)"><svg class="i"><use href="#i-minus"/></svg></button>
        <button data-v="zoomfit" id="vZoom" class="zoom-pct" title="Fit / 100% (0)">100%</button>
        <button data-v="zoomin" class="icon-btn" title="Zoom in (+)"><svg class="i"><use href="#i-plus"/></svg></button>
      </span>
      <button data-v="pano" id="vPano" class="zoom-pct" title="360° view / flat (V)" hidden>360°</button>
      <button data-v="fav" class="icon-btn" title="Favorite (F)"><svg class="i"><use href="#i-heart"/></svg></button>
      <button data-v="download" class="icon-btn" title="Download"><svg class="i"><use href="#i-download"/></svg></button>
      <button data-v="restore" class="icon-btn" title="Restore" hidden><svg class="i"><use href="#i-restore"/></svg></button>
      <button data-v="unlock" class="icon-btn" title="Move to library" hidden><svg class="i"><use href="#i-unlock"/></svg></button>
      <button data-v="info" class="icon-btn" title="Info (I)"><svg class="i"><use href="#i-info"/></svg></button>
      <button data-v="delete" class="icon-btn" title="Delete"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
    </div>
    <div class="v-body">
      <div id="vAmbient" class="v-ambient"></div>
      <div id="vStage" class="v-stage"></div>
      <button data-v="prev" class="v-nav prev" title="Previous (←)"><svg class="i"><use href="#i-left"/></svg></button>
      <button data-v="next" class="v-nav next" title="Next (→)"><svg class="i"><use href="#i-right"/></svg></button>
      <aside id="vInfo" class="v-info" hidden></aside>
    </div>
  </div>

  <!-- Hosted site, opened inside the app (Sites). The iframe is another origin (the sites server's port); the sandbox
       keeps that origin (so the site's own storage works) but stops it from navigating this page away. -->
  <div id="siteFrame" class="site-frame" hidden>
    <button id="sfBack" class="sf-back" title="Back to Sites (Esc)" aria-label="Back to Sites"><svg class="i"><use href="#i-left"/></svg></button>
    <div id="sfLoad" class="sf-load"><span class="sf-spin"></span><strong id="sfLoadName"></strong><small id="sfLoadMsg"></small></div>
    <iframe id="sfFrame" title="Site" allow="fullscreen; autoplay; clipboard-write"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-downloads allow-pointer-lock allow-presentation"></iframe>
  </div>

  <!-- Uploads -->
  <div id="uploads" class="uploads" hidden>
    <div class="up-head"><strong id="upTitle">Uploading</strong><button id="upClose" class="icon-btn sm" title="Hide"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div id="upList" class="up-list"></div>
  </div>
  <div id="drop" class="drop" hidden><div><svg class="i"><use href="#i-cloud-up"/></svg><span id="dropText">Drop photos, videos and GIFs to upload</span></div></div>

  <!-- Modal -->
  <div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js?v=41"></script>
</body>
</html>
